<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f1e9">
    <meta name="description" content="The LeanPass documentation has moved to leanpass.vercel.app.">
    <link rel="canonical" href="https://leanpass.vercel.app/">
    <link rel="icon" href="/redirect.svg" type="image/svg+xml">
    <title>LeanPass documentation has moved</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap");

      :root {
        color-scheme: light;
        font-family: "Inter", sans-serif;
        color: #252b25;
        background: #f4f1e9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 2rem;
        place-items: center;
      }

      main {
        width: min(100%, 680px);
        text-align: center;
      }

      img {
        display: block;
        width: 180px;
        height: auto;
        margin: 0 auto 2.5rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 8vw, 5.5rem);
        font-weight: 400;
        letter-spacing: -0.055em;
        line-height: 1.02;
      }

      p {
        margin: 1.5rem 0 2rem;
        font-size: clamp(1.15rem, 2.5vw, 1.4rem);
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        min-height: 3.5rem;
        align-items: center;
        gap: 1rem;
        padding: 0.8rem 1.25rem;
        color: #fffdf7;
        background: #252b25;
        font-size: 1.05rem;
        text-decoration: none;
        transition: background-color 150ms ease;
      }

      a:hover {
        background: #a13e27;
      }

      a:focus-visible {
        outline: 3px solid #a13e27;
        outline-offset: 4px;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/redirect.svg" alt="">
      <h1>The documentation has moved.</h1>
      <p>LeanPass documentation is now at leanpass.vercel.app.</p>
      <a href="https://leanpass.vercel.app/">
        Visit the new documentation
        <span aria-hidden="true">→</span>
      </a>
    </main>
  </body>
</html>
